<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEV 叙事工作台 · QuantBoard</title>
<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0; --border2:#cbd5e1;
    --text:#0f172a; --muted:#64748b; --muted2:#94a3b8;
    --blue:#2563eb; --blue-bg:#eff6ff;
    --green:#16a34a; --green-bg:#dcfce7;
    --amber:#a16207; --amber-bg:#fef9c3;
    --red:#dc2626; --red-bg:#fee2e2;
    --purple:#7c3aed; --purple-bg:#ede9fe;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{background:#fff;border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:16px}
  header h1{font-size:20px;font-weight:700}
  header .sub{font-size:12px;color:var(--muted)}
  header .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12px;border:1px solid var(--border)}
  .pill.ok{background:var(--green-bg);color:var(--green);border-color:#bbf7d0}
  .pill.bad{background:var(--red-bg);color:var(--red);border-color:#fecaca}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  input[type=date]{border:1px solid var(--border2);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
  button{border:1px solid var(--border2);background:#fff;border-radius:8px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--blue);color:var(--blue)}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  button.primary:hover{background:#1d4ed8;color:#fff}
  nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--border);padding:0 28px}
  nav .tab{padding:12px 20px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  nav .tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
  main{padding:20px 28px;max-width:1560px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
  .card h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .card h3 .hint{font-size:11px;color:var(--muted2);font-weight:400;margin-left:auto}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:2fr 1fr}
  .kpi-row{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}
  /* 盘中降级原因通栏（2026-10-14）：grid-column:1/-1 占满一行，不挤占卡片位 */
  .kpi-note{grid-column:1/-1;background:var(--amber-bg);color:var(--amber);border:1px solid var(--border2);border-radius:8px;padding:7px 12px;font-size:12px;line-height:1.5}
  .kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .kpi .k{font-size:12px;color:var(--muted);margin-bottom:4px}
  .kpi .v{font-size:20px;font-weight:700;line-height:1.2}
  .kpi .v small{font-size:12px;font-weight:500;color:var(--muted)}
  .kpi .s{font-size:11px;color:var(--muted2);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--blue)}
  td{padding:8px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
  tr:hover td{background:#f8fafc}
  .num{font-variant-numeric:tabular-nums;font-weight:600}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500}
  .b-green{background:var(--green-bg);color:var(--green)}
  .b-amber{background:var(--amber-bg);color:var(--amber)}
  .b-red{background:var(--red-bg);color:var(--red)}
  .b-gray{background:#f1f5f9;color:var(--muted)}
  .b-blue{background:var(--blue-bg);color:var(--blue)}
  .b-purple{background:var(--purple-bg);color:var(--purple)}
  .bar{height:6px;border-radius:3px;background:#e2e8f0;overflow:hidden;min-width:80px}
  .bar i{display:block;height:100%;border-radius:3px}
  .empty{color:var(--muted2);font-size:13px;padding:24px;text-align:center}
  pre{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:14px;font-size:12px;overflow:auto;max-height:420px;white-space:pre-wrap;margin-top:10px}
  .flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .phase-big{font-size:26px;font-weight:800;letter-spacing:1px}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
  /* ---------- 调用日志（对齐 CF AI Gateway Logs 行内展开样式，2026-10-10） ---------- */
  .lg-table{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:4px}
  .lg-table table{margin:0}
  .lg-table th{background:#f8fafc}
  .lg-row{cursor:pointer}
  .lg-row:hover td{background:#f8fafc}
  .lg-row.open td{background:var(--blue-bg)}
  .lg-caret{display:inline-block;width:16px;color:var(--muted2);font-size:11px;transition:transform .12s}
  .lg-row.open .lg-caret{transform:rotate(90deg)}
  .lg-detail>td{background:#fbfcfe;padding:14px 16px 18px;white-space:normal}
  .lg-card{border:1px solid var(--border);border-radius:10px;background:#fff;padding:14px 16px}
  .lg-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .lg-title{font-size:14px;font-weight:700}
  .lg-asof{color:var(--muted2);font-weight:400;font-size:12px;margin-left:6px}
  .lg-toggle{margin-left:auto;display:flex;gap:8px}
  .lg-toggle button{padding:4px 12px;border-radius:8px;font-size:12px}
  .lg-toggle button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .lg-meta{display:flex;gap:40px;margin:12px 0 2px;flex-wrap:wrap}
  .lg-meta .k{font-size:12px;color:var(--muted)}
  .lg-meta .v{font-size:15px;font-weight:600;margin-top:2px}
  .lg-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
  @media (max-width:1100px){.lg-panels{grid-template-columns:1fr}}
  .lg-panel{border:1px solid var(--border);border-radius:10px;background:#fff;display:flex;flex-direction:column;min-width:0}
  .lg-phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600}
  .lg-phead .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .lg-phead .st{color:var(--muted);font-weight:500;font-size:12px}
  .lg-copy{margin-left:auto;border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 8px;border-radius:6px}
  .lg-copy:hover{color:var(--blue);background:var(--blue-bg)}
  .lg-filter{margin:8px 10px 4px;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;color:var(--text);background:#f8fafc;width:calc(100% - 20px)}
  .lg-filter:focus{outline:none;border-color:var(--blue);background:#fff}
  .lg-tree{overflow:auto;max-height:480px;padding:10px 12px;font:12px/1.6 ui-monospace,Consolas,"Courier New",monospace;min-height:120px}
  .lg-raw pre{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:14px;font-size:12px;overflow:auto;max-height:480px;margin-top:8px}
  .lg-foot{display:flex;gap:26px;row-gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
  .lg-foot code{background:#f1f5f9;border-radius:5px;padding:1px 6px;color:var(--text)}
  .lg-foot .k{color:var(--muted2)}
  .lg-empty{color:var(--muted2);font-size:12px;padding:16px;text-align:center;font-family:inherit}
  /* ---------- JSON 树（键紫/串橙/数蓝/布红/空灰，对齐 CF 配色） ---------- */
  .jt-line{white-space:pre-wrap;word-break:break-all}
  .jt-head{cursor:pointer;border-radius:4px}
  .jt-head:hover{background:#f1f5f9}
  .jt-arrow{display:inline-block;width:15px;color:var(--muted2)}
  .jt-kids{padding-left:16px;border-left:1px solid #eef2f7;margin-left:6px}
  .jt-fold>.jt-kids,.jt-fold>.jt-close{display:none}
  .jt-ellipsis{display:none;color:var(--muted2)}
  .jt-fold>.jt-head .jt-ellipsis{display:inline}
  .jt-count{color:var(--muted2);font-size:10px;margin:0 6px}
  .jt-k{color:#7048c8}
  .jt-s{color:#b45309}
  .jt-n{color:#1d4ed8}
  .jt-b{color:#dc2626}
  .jt-null{color:#94a3b8}
  .jt-br{color:var(--text)}
  .jt-more{border:none;background:none;color:var(--blue);cursor:pointer;font-size:11px;padding:0 4px}
  .jt-more:hover{text-decoration:underline}
  mark{background:#fef08a;border-radius:3px;padding:0 1px}
  /* ---------- 涨停复盘：总览卡 + 板块 chips + 筛选条 ---------- */
  .kpi.click{cursor:pointer}
  .kpi.click:hover{border-color:var(--blue)}
  .kpi.on{border-color:var(--blue);background:var(--blue-bg)}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap}
  .chip:hover{border-color:var(--blue);color:var(--blue)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .chip.plain{cursor:default;color:var(--muted2)}
  .lf-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 12px}
  .lf-q{border:1px solid var(--border2);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;width:180px;background:#fff;color:var(--text)}
  .lf-q:focus{outline:none;border-color:var(--blue)}
  .lf-bar select{border:1px solid var(--border2);border-radius:8px;padding:5px 6px;font:inherit;font-size:12px;background:#fff;color:var(--text);max-width:150px}
  .lf-bar input[type=date]{width:116px;padding:6px 8px;font-size:12px}  /* 区间日期控件收窄：原生默认宽右侧留白（2026-10-10 用户指出瑕疵） */
  .lf-bar .sep{font-size:12px;color:var(--muted2)}  /* 区间分隔符：勿用 .cnt（其 margin-left:auto 会吞空白） */
  .lf-bar .cnt{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
  .board-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 12px}
  .board-row .k{font-size:12px;color:var(--muted2);flex:none}
</style>
</head>
<body>
<header>
  <div><h1>🧭 JEV 叙事工作台</h1><div class="sub">连板情绪指数 · 热榜叙事 · 涨停复盘 —— 数据实时透传 :8000</div></div>
  <div class="spacer"></div>
  <input type="date" id="date">
  <span class="pill" id="srcPill"><span class="dot"></span>数据源 :8000</span>
  <span class="pill" id="refreshPill"><span class="dot"></span><span id="refreshAt">未刷新</span></span>
  <button onclick="loadAll()">刷新</button>
  <button class="primary" onclick="loadAll()">实时</button>
</header>
<nav>
  <div class="tab active" data-tab="overview">📊 总览</div>
  <div class="tab" data-tab="quotes">📈 热榜行情</div>
  <div class="tab" data-tab="relay">🧮 连板指数</div>
  <div class="tab" data-tab="labels">🏷️ 涨停复盘</div>
</nav>
<main>
  <section id="tab-overview">
    <div class="kpi-row" id="kpiRow"></div>
    <div class="grid g3" style="margin-top:14px">
      <div class="card"><h3>📈 当日逐槽 · 日内演化 <span class="hint" id="slotHint"></span></h3>
        <table id="slotTable"></table></div>
      <div>
        <div class="card"><h3>📅 EOD 日级窗口</h3><table id="eodTable"></table></div>
        <div class="card" style="margin-top:14px"><h3>🧮 今日连板情绪</h3><div id="relayMini" class="empty">加载中…</div></div>
      </div>
    </div>
    <div class="card" style="margin-top:14px"><h3>📉 近15日 · 连板指数 vs 热度温度
      <span class="hint"><span class="legend"><span><i style="background:#2563eb"></i>连板指数</span><span><i style="background:#f59e0b"></i>温度分</span></span></span></h3>
      <div id="relayChart"></div></div>
  </section>

  <section id="tab-quotes" style="display:none">
    <div class="card">
      <h3>热榜行情 <span class="hint" id="quotesHint"></span></h3>
      <div class="lf-bar" style="margin-bottom:8px">帧选择：<select id="quoteSlotSel" onchange="qSlotChange(this.value)"><option value="">加载中…</option></select><span id="quoteSlotHint" style="color:var(--muted2);margin-left:8px"></span></div>
      <div class="kpi-row" id="quotesKpi" style="grid-template-columns:repeat(6,1fr);margin-bottom:12px"></div>
      <div class="lf-bar" id="quotesFilterBar"></div>
      <table id="quotesTable"></table>
    </div>
  </section>

  <section id="tab-relay" style="display:none">
    <div class="kpi-row" id="relayKpi" style="grid-template-columns:repeat(7,1fr)"></div>
    <div class="card" style="margin-top:14px"><h3>🗓️ 判定明细 <span class="hint" id="relayHint">加载中…</span></h3>
      <div class="lf-bar" id="relayFilterBar" style="margin-top:2px"></div>
      <table id="relayTable"></table></div>
    <div class="card" style="margin-top:14px"><h3>📈 连板指数序列 <span class="hint">跟随判定明细区间筛选</span></h3><div id="relayChart2"></div></div>
  </section>

  <section id="tab-labels" style="display:none">
    <div class="card">
      <h3>梯队分布与打标汇总 <span class="hint" id="labelHint"></span></h3>
      <div class="kpi-row" id="labelKpi" style="grid-template-columns:repeat(7,1fr);margin-bottom:12px"></div>
      <div class="board-row" id="labelBoardRow"></div>
      <div class="lf-bar" id="labelFilterBar"></div>
      <table id="labelTable"></table>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const STATE = { series: [], day: null, slots: [], rawSlots: [], eod: null, labels: null, quotes: null,
  labelEntries: [], labelUi: { openKey: null, mode: 'detail', q1: '', q2: '' },
  slotEntries: [], relayEntries: [],
  // 行展开详情 UI（明细存档页已删除，平移至总览逐槽表 / 连板指数判定明细行内展开）
  detailUi: { slot: { openKey: null, mode: 'detail', q1: '', q2: '' }, relay: { openKey: null, mode: 'detail', q1: '', q2: '' } },
  relayDocs: {},  // date → 该日连板指数完整存档（判定明细行展开懒拉；undefined=未拉，null=已拉无档）
  quotesEntries: [], quotesUi: { openKey: null, vote: { mode: 'detail', q1: '', q2: '' }, lc: { mode: 'detail', q1: '', q2: '' }, res: { mode: 'detail', q1: '', q2: '' }, trd: { mode: 'detail', q1: '', q2: '' },
    hea: { mode: 'detail', q1: '', q2: '' }, vpq: { mode: 'detail', q1: '', q2: '' } },
  quotesSlots: [],  // 当日有 jev 判读的槽位（quotes-review 响应 voteSlots，帧选择器数据源）
  quotesFilter: { q: '', vote: '', lc: '', res: '', trd: '', hea: '', vpq: '', agree: '' },
  quotesSort: { key: 'rank', dir: 1 },
  labelFilter: { q: '', board: '', height: '', driver: '', depth: '', fresh: '', buy: '', scope: 'zt' },
  relayFilter: { phase: '', momentum: '', ladder: '', money: '', theme: '' },
  relayRange: null,  // 判定明细日期区间 {start,end}；null=未初始化（首次渲染按近1月兜）；end=null=跟随最新
  relaySort: { key: 'date', dir: -1 },
  labelSort: { key: 'rank', dir: 1 } };

const PHASE_CN = {relay_heat:'接力顺畅', divergence:'高位分歧', collapse:'退潮崩塌', launch:'启动首板', bottoming:'冰点出清', insufficient_evidence:'证据不足'};
const MOM_CN = {accelerating:'加速', holding:'惯性', weakening:'退潮', reversing:'逆转', insufficient_evidence:'证据不足'};
const LADDER_CN = {pyramid:'金字塔', fracture:'中位断层', inverted:'高位倒挂', sparse:'稀疏', insufficient_evidence:'证据不足'};
const MONEY_CN = {strong:'赚钱', neutral:'中性', losing:'亏钱', insufficient_evidence:'证据不足'};
const THEME_CN = {mainline_continue:'主线延续', rotation:'轮动', scattered:'散乱', insufficient_evidence:'证据不足'};
const STAGE_CN = {ice:'冰点', start:'启动', ferment:'发酵', climax:'高潮', retreat:'退潮'};
const CROWD_CN = {no_crowding:'无拥挤', top_acceleration:'高位加速', late_seal_weakness:'封板弱化', breadth_climax:'广度高潮', crowd_clearing:'拥挤解除', insufficient_evidence:'证据不足'};
const PATTERN_CN = {low_recover:'低开修复', high_fade:'冲高回落', steady_strong:'全天强势', steady_weak:'全天弱势', rally_fade:'冲高回落', late_rescue:'尾盘偷袭', one_way_down:'单边走弱', wide_swing:'剧烈反复', narrow_range:'窄幅平淡', unclear:'证据不足'};
const DRIVER_CN = {product_event:'产品事件', capital_flow:'资金接力', concept_stretch:'蹭概念', industry_cycle:'行业周期', ma_restructure:'并购重组', order_earnings:'订单业绩', policy:'政策'};
const CAT_DEPTH_CN = {core_main_business:'核心主业承接', new_business_scaling:'新业务放量承接', new_business_early:'新业务早期承接', equity_or_affiliate:'股权关联传导', concept_assembly:'概念组装弱关联', insufficient_evidence:'信息不足'};
const BUY_SIDE_CN = {independent_catalyst:'自身独立催化', sector_follow:'板块联动跟随', high_board_relay:'高位卡位/情绪接力', pure_sentiment:'纯情绪修复'};
const FRESH_CN = {fresh_catalyst:'新鲜', continuing:'延续', none:'无明确催化', unclear:'信息不足'};
// 热榜行情页（quotes-review 读口）：LC 五段中文名 + 档位序/色（S/A 绿、B 蓝、C 灰、D/E 红；缺 '--'）
const LC_STAGE_CN = {ignition:'点火', expansion:'扩散', crowded:'拥挤', reversal:'反转', cooling:'降温'};
const LC_STAGE_ORDER = {ignition:0, expansion:1, crowded:2, reversal:3, cooling:4};
const LC_STAGE_COLOR = {ignition:'#16a34a', expansion:'#2563eb', crowded:'#a16207', reversal:'#dc2626', cooling:'#94a3b8'};
// 共振维独立判读（RES 试点题集）：jevv 方向序 + 中文名 + 强度分带色（与 ammo STRENGTH_BANDS 同口径）
const RES_DIR_CN = {buy:'走强', sell:'走弱', hold:'同步', insufficient:'判据不足'};
const RES_DIR_ORDER = {buy:0, hold:1, sell:2, insufficient:3};
const RES_BANDS = [[85,'#16a34a'],[67,'#2563eb'],[50,'#a16207'],[27,'#94a3b8'],[-1,'#dc2626']];
const resBandColor = s => { for (const [floor, c] of RES_BANDS) if (s >= floor) return c; return 'var(--muted2)'; };
// 趋势维独立判读（TRD 试点题集，2026-10-15）：方向中文名 + 模式（series=序列模式 / fallback=帧行字段模式）
const TRD_DIR_CN = {buy:'多头', sell:'空头', hold:'震荡', insufficient:'判据不足'};
const TRD_DIR_ORDER = {buy:0, hold:1, sell:2, insufficient:3};
const TRD_MODE_CN = {series:'序列模式', fallback:'帧行模式'};
// 热度维（HEA）/量价维（VPQ）独立判读（2026-10-15 试点第四/五维）
const HEA_TIER_CN = {A:'A 强势', B:'B 中上', C:'C 兜底', D:'D 弱势', unknown:'锚缺失'};
const VPQ_TIER_CN = {A:'A 放量流入', B:'B 放量', C:'C 封板/缩量', D:'D 下跌', E:'E 硬风险', unknown:'锚缺失'};
const VPQ_QUAD_CN = {rise_volume:'放量上涨', rise_shrink:'缩量上涨', normal:'中态',
                     fall_volume:'放量下跌', fall_shrink:'缩量下跌'};
const HEA_DIR_CN = {buy:'关注升', sell:'关注降', hold:'同步', insufficient:'判据不足'};

const TIER_RANK = {S:6, A:5, B:4, C:3, D:2, E:1};
const tierB = v => badge(v||'--', (v==='S'||v==='A')?'b-green':v==='B'?'b-blue':(v==='D'||v==='E')?'b-red':'b-gray');
const dirB = v => v==='buy' ? badge('buy','b-green') : v==='sell' ? badge('sell','b-red') : v==='hold' ? badge('hold','b-gray') : '';
const agreeB = v => v==='agree' ? badge('一致','b-green') : v==='diverge' ? badge('分歧','b-amber') : '';
const numOr = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
const fmtYi = v => { const n = numOr(v, null); return n == null ? '--' : (n / 1e8).toFixed(2); };
const fmtYiCell = v => { const n = numOr(v, null); return n == null ? '--' : (n / 1e8).toFixed(2) + ' 亿'; };
const boardsCell = v => v == null ? '--' : (v > 1 ? v + '板' : '首板');
const fmtPctChg = v => { const n = numOr(v, null); return n == null ? '--' : (n > 0 ? '+' : '') + n.toFixed(2) + '%'; };

const badge = (txt, cls) => txt ? `<span class="badge ${cls}">${esc(txt)}</span>` : '<span class="badge b-gray">-</span>';
const phaseB = v => badge(PHASE_CN[v]||v, v==='relay_heat'?'b-green':v==='divergence'?'b-amber':v==='collapse'?'b-red':v==='launch'?'b-blue':'b-gray');
const momB = v => badge(MOM_CN[v]||v, v==='accelerating'?'b-green':v==='holding'?'b-gray':v==='weakening'?'b-amber':'b-purple');
const ladderB = v => badge(LADDER_CN[v]||v, v==='pyramid'?'b-green':v==='fracture'?'b-amber':v==='inverted'?'b-red':'b-gray');
const moneyB = v => badge(MONEY_CN[v]||v, v==='strong'?'b-green':v==='neutral'?'b-gray':'b-red');
const themeB = v => badge(THEME_CN[v]||v, v==='mainline_continue'?'b-purple':v==='rotation'?'b-blue':'b-gray');
const stageColor = s => ({ice:'#38bdf8',start:'#34d399',ferment:'#f59e0b',climax:'#ef4444',retreat:'#94a3b8'}[s] || '#94a3b8');

// 置信度芯片（2026-10-12 用户裁决找回）：≥P60 灰=正常可读；P35-60 琥珀=存疑；P<35 红=模型两可，勿当结论。
// 旧文档 answers 缺 confidence 时返回空串，行样式保持不变（fail-visible 缺省即不显示）
const confChip = c => {
  if (c == null || typeof c !== 'number' || !isFinite(c)) return '';
  const p = Math.round(c * 100);
  const col = c >= 0.6 ? 'var(--muted2)' : c >= 0.35 ? '#b45309' : '#dc2626';
  return ` <span title="模型置信度 P${p}${c < 0.35 ? '（两可，勿当结论）' : ''}" style="font-size:11px;font-weight:400;color:${col}">P${p}</span>`;
};
// 指数分区三色（2026-10-11 分带诊断 103 天读数，详见 docs/hotlist-jev/jev-relay-band-toxic-diagnostic.md §4.5）：
// 绿=idx≥60（次日溢价赢:输=3.4:1）/ 红=idx<25（1:2.2 不利）/ 黄=40-60且温度≥56（两轮同向弱负）；
// 其余中性区灰 var(--muted)；缺温度日不判黄（fail-visible）。观察线索非交易规则。
const zoneIdxColor = r => {
  if (r == null || r.relayIndex == null) return 'var(--muted)';
  if (r.relayIndex >= 60) return 'var(--green)';
  if (r.relayIndex < 25) return 'var(--red)';
  if (r.relayIndex >= 40 && r.dayTemperature != null && r.dayTemperature >= 56) return 'var(--amber)';
  return 'var(--muted)';
};

async function jget(path){ const r = await fetch(path); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }

// EOD 文档可用性（2026-10-14）：degraded / missing_token 的 EOD 文档 answers 与 scores
// 都是 null，给不出任何读数——此时它和「没有 EOD」等价，必须走盘中降级，
// 而不能挂着「收盘口径」标签展示一片空白。renderKpis / renderEod 共用这一把尺子。
const isEodUsable = e => !!(e && (e.answers || e.scores));

// 上一交易日参照（2026-10-14）：relay 序列是「最近 N 日」全量，与当前选中日期无关，
// 直接取末条会在回看过去日期时把更晚的日期称作「上一交易日」。故只认严格早于
// 选中日的条目；选中的是最新日或过去无参照时退回末条并改称「最近可得」。
// 选中日期取自日期输入框而非 STATE.day——无 relay-index 存档的日子 STATE.day 为 null，
// 那时更需要知道「用户在看哪天」才能给出正确参照。
function selectedDate(){ const el = $('date'); return el ? el.value : ''; }
function prevTradingDayRef(date){
  const ref = date || selectedDate();
  const before = STATE.series.filter(s => s && s.tradingDate && (!ref || s.tradingDate < ref));
  if (before.length) return { row: before[before.length - 1], label: '上一交易日' };
  const last = STATE.series.length ? STATE.series[STATE.series.length - 1] : null;
  return last ? { row: last, label: '最近可得' } : { row: null, label: '' };
}

// 分位列口径（2026-10-14）：当前槽温度在近 20 个交易日 EOD 日级温度中的分位（0-1）。
// 后端 compute_and_upsert_for_slot 自动带出；存量 618 篇已回填 545 篇，其余为轨道
// 早期「近20日有效样本 <10」的不可算日（fail-visible 留空，不补 0）。
const PCT_TITLE = '温度分位 = 当前槽温度在近 20 个交易日 EOD 日级温度中的分位；有效样本 <10 或未回填的早期文档为空';

let _loadSeq = 0;
async function loadAll(){
  const seq = ++_loadSeq;
  const date = $('date').value;
  let series, slots, labels, quotes;
  try {
    [series, slots, labels, quotes] = await Promise.all([
      jget('/api/hotlist-jev/relay-index?days=400' + (date ? '&date=' + date : '')),
      jget('/api/hotlist-jev/series' + (date ? '?date=' + date : '')),
      jget('/api/hotlist-jev/limitup-labels' + (date ? '?date=' + date + '&with_raw=1' : '?with_raw=1')),
      jget('/api/hotlist-jev/quotes-review?with_docs=1' + (date ? '&date=' + date : '')).then(r => { STATE.quotesSlots = r.voteSlots || []; return r; }),
    ]);
  } catch (err) {
    if (seq !== _loadSeq) return;
    // fail-visible：读口失败亮红不静默滞留（保留上次数据，刷新时间标注失败）
    $('srcPill').className = 'pill bad';
    $('srcPill').innerHTML = '<span class="dot"></span>数据源异常';
    $('refreshAt').textContent = '失败 ' + new Date().toLocaleTimeString('zh-CN', {hour12:false});
    return;
  }
  if (seq !== _loadSeq) return; // 过期响应不覆盖（快速切日期竞态守卫）
  $('srcPill').className = 'pill';
  $('srcPill').innerHTML = '<span class="dot"></span>数据源 :8000';
  STATE.series = series.series || [];
  STATE.day = series.day || null;
  STATE.rawSlots = slots.slots || [];
  STATE.slots = STATE.rawSlots.filter(s => s.status === 'ok');
  STATE.eod = slots.eod;
  STATE.labels = labels;
  STATE.quotes = quotes;
  // 连板指数当日完整存档预入缓存（判定明细行展开当日零请求；series 行不含 raw 大字段）
  if (STATE.day && STATE.day.tradingDate) STATE.relayDocs[STATE.day.tradingDate] = STATE.day;
  renderKpis(); renderSlots(); renderEod(); renderRelayMini();
  renderRelayTab(); renderLabels(); renderQuotes(); renderCharts();
  $('refreshAt').textContent = '刷新 ' + new Date().toLocaleTimeString('zh-CN', {hour12:false});
}

function renderKpis(){
  // ── KPI 口径（2026-10-14 根因修复）────────────────────────────────────────
  // 原实现只读 EOD 文档 + relay-index：收盘前（09:30-15:00，占交易日约 69%）8 张卡
  // 全空，而同一响应里的 STATE.slots 已带同题目盘中完整读数——有数据不展示。
  // 现改为 EOD 优先；EOD 未生成时降级到最新 ok 槽的**同题目**读数（档位/温度/拥挤
  // 三项一一对应），口径标签明示「盘中口径 · 最新槽 HH:MM」，与「收盘口径」可区分。
  // relay-index 四卡是收盘池口径（涨停/晋级/炸板池），无盘中源：留 '-' 但给结构化
  // 原因 + 参照日指数，不拿非当日值冒充当日（§4.0：缺失可见，不伪造）。
  // EOD 存在但 degraded/missing_token 时 answers/scores 全 null：此时它给不出任何读数，
  // 不能拿「收盘口径」标签配一片空白（那正是本次修的病灶），按不可用处理走盘中降级。
  // 该判定与 renderEod() 共用 isEodUsable，否则两处会对同一文档给出相反口径。
  const eod = isEodUsable(STATE.eod) ? STATE.eod : null;
  const slot = STATE.slots.length ? STATE.slots[STATE.slots.length - 1] : null;
  const intraday = !eod && !!slot;
  const ea = eod ? (eod.answers || {}) : {};
  const sa = slot ? (slot.answers || {}) : {};
  // 日级题（EOD）↔ 槽级题（盘中）同题目映射：day_stage↔sequence_stage、
  // day_temperature↔temperature、day_crowding↔crowding
  const stageAns = intraday ? (sa.sequence_stage || {}) : (ea.day_stage || {});
  const crowdAns = intraday ? (sa.crowding || {}) : (ea.day_crowding || {});
  const tempRaw = intraday
    ? (slot.scores ? slot.scores.temperature : null)
    : (eod && eod.scores ? eod.scores.day_temperature : null);
  const temp = tempRaw != null ? Math.round(tempRaw) : null;
  const stage = stageAns.choice;
  const crowd = crowdAns.choice;
  const conf = stageAns.confidence;
  const frame = intraday ? (sa.frame_stage || {}).choice : null;
  const stageTxt = STAGE_CN[stage] || stage || '-';
  const stamp = intraday ? `盘中口径 · 最新槽 ${esc(slot.slotTime || '?')}` : '收盘口径';
  // 帧档与序列档分歧=瞬时冲击信号（同 JEV 叙事面板 hero chip 语义）
  const stageSub = frame && frame !== stage ? `${stamp} · 当前帧 ${STAGE_CN[frame] || frame}` : stamp;
  const d = STATE.day || {};
  const relayReady = d.relayIndex != null;
  // 上一交易日参照只进副标，主值仍为 '-'（明确不是当日值）
  const prevRef = relayReady ? { row: null, label: '' } : prevTradingDayRef();
  const prev = prevRef.row;
  const relaySub = relayReady
    ? esc(d.tradingDate || '')
    : `收盘口径 · 15:30 后出数${prev ? `（${prevRef.label} ${esc(String(prev.tradingDate || '').slice(5))} = ${prev.relayIndex ?? '-'}）` : ''}`;
  const relayCard = (k, v, sub) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
  // 降级原因通栏：grid-column:1/-1，不占卡片位；两条件独立，可同时成立
  const why = [];
  if (intraday) why.push('EOD 日级文档未生成（daily:15:30 收盘快照后出数），前四张卡取最新 ok 槽的同题目实时读数');
  if (!relayReady) why.push('连板指数为收盘池口径（涨停/晋级/炸板，15:30 后出数），接力四卡留空并附参照日指数');
  const note = why.length ? `<div class="kpi-note">⏳ 盘中降级：${why.join('；')}。</div>` : '';
  $('kpiRow').innerHTML = note + `
    <div class="kpi"><div class="k">市场阶段${intraday ? '（盘中）' : ' (EOD)'}</div><div class="v" style="color:${stage==='climax'?'#dc2626':stage==='ferment'?'#a16207':stage==='retreat'?'#64748b':'#2563eb'}">${stageTxt}</div><div class="s">${intraday ? stageSub : (PATTERN_CN[(ea.day_pattern||{}).choice] || '收盘口径')}</div></div>
    <div class="kpi"><div class="k">日级温度</div><div class="v" style="color:${tempColor(temp)}">${temp ?? '-'}</div><div class="s">${stamp === '收盘口径' ? '0-100 · 参照20日' : stamp}</div></div>
    <div class="kpi"><div class="k">拥挤形态</div><div class="v" style="font-size:15px">${CROWD_CN[crowd]||'-'}${confChip(crowdAns.confidence)}</div><div class="s">${stamp}</div></div>
    <div class="kpi"><div class="k">档位置信</div><div class="v">P${conf!=null?Math.round(conf*100):'-'}</div><div class="s">${intraday ? 'sequence_stage' : 'day_stage'}</div></div>
    ${relayCard('连板情绪指数', `<span style="color:${zoneIdxColor(d)}">${d.relayIndex ?? '-'}</span>`, relaySub)}
    ${relayCard('接力相位', `${phaseB(d.relayPhase)}${confChip(((d.answers||{}).relay_phase||{}).confidence)}`, relaySub)}
    ${relayCard('接力边际', `${momB(d.relayMomentum)}${confChip(((d.answers||{}).relay_momentum||{}).confidence)}`, relaySub)}
    ${relayCard('梯队 / 钱效', `${ladderB(d.ladderHealth)} ${moneyB(d.moneyEffect)}`, relaySub)}`;
}

function renderSlots(){
  // 明细存档已并入：全部 rawSlots（含降级，fail-visible）行内展开请求/返回/原始 JSON；末行 EOD
  const ui = STATE.detailUi.slot;
  STATE.slotEntries = STATE.rawSlots.map(s => ({ key: String(s._id || ('slot:' + s.slotTime)),
    kind: 'slot', label: String(s.slotTime || '?'), doc: s }));
  if (STATE.eod) STATE.slotEntries.push({ key: String(STATE.eod._id || 'eod'), kind: 'eod',
    label: 'EOD 情绪', doc: STATE.eod });
  const rows = STATE.rawSlots.map(s => {
    const a = s.answers || {};
    const stage = (a.frame_stage||{}).choice;
    const seq = (a.sequence_stage||{}).choice;
    const crowd = (a.crowding||{}).choice;
    const pct = (a.temperature||{}).percentile;
    // 温度唯一口径 = scores.temperature（后端按 legend ÷(n-1)×100 还原，与 EOD day_temperature 同式）；
    // answers.temperature.score 是 0-9 原始档位分，直接 ×10 是另一套刻度（顶 90），同列与 EOD 不可比
    const temp = s.scores ? s.scores.temperature : null;
    const t = temp != null ? Math.round(temp) : null;
    const entry = STATE.slotEntries.find(x => x.doc === s);
    const open = ui.openKey === entry.key;
    const stBadge = s.status !== 'ok'
      ? ` ${badge(s.status || '-', 'b-amber')}` : '';
    return `<tr class="lg-row${open ? ' open' : ''}" onclick="lgRow('slot', '${js(entry.key)}')">
    <td><span class="lg-caret">▶</span><span class="num">${esc(s.slotTime||'')}</span>${stBadge}</td>
    <td style="color:${stageColor(stage)};font-weight:700">${STAGE_CN[stage]||stage||'-'}${confChip((a.frame_stage||{}).confidence)}</td>
    <td>${seq && seq!==stage ? `<span style="color:${stageColor(seq)}">${STAGE_CN[seq]||seq}</span>${confChip((a.sequence_stage||{}).confidence)}` : ''}</td>
    <td><div class="flex"><span class="num" style="color:${tempColor(t)}">${t??'-'}</span><div class="bar"><i style="width:${t??0}%;background:${tempColor(t)}"></i></div></div></td>
    <td>${badge(CROWD_CN[crowd]||'-', crowd==='breadth_climax'?'b-red':crowd==='top_acceleration'?'b-amber':crowd==='late_seal_weakness'?'b-purple':'b-gray')}${confChip((a.crowding||{}).confidence)}</td>
    <td class="num" title="${PCT_TITLE}">${pct!=null?'P'+Math.round(pct*100):'-'}</td></tr>`
    + (open ? `<tr class="lg-detail"><td colspan="6">${detailHtml(entry, 'slot')}</td></tr>` : '');
  }).join('');
  const e = STATE.eod;
  let eodRow = '';
  if (e){
    const entry = STATE.slotEntries.find(x => x.kind === 'eod');
    const open = ui.openKey === entry.key;
    const u = e.usage || {};
    eodRow = `<tr class="lg-row${open ? ' open' : ''}" onclick="lgRow('slot', '${js(entry.key)}')">
    <td><span class="lg-caret">▶</span><span class="num">EOD</span>${badge(e.status || '-', e.status === 'ok' ? 'b-green' : 'b-amber')}</td>
    <td style="color:${stageColor(((e.answers||{}).day_stage||{}).choice)};font-weight:700">${STAGE_CN[((e.answers||{}).day_stage||{}).choice] || '-'}${confChip(((e.answers||{}).day_stage||{}).confidence)}</td>
    <td>日级</td>
    <td><div class="flex"><span class="num" style="color:${tempColor(e.scores ? Math.round(e.scores.day_temperature ?? NaN) : null)}">${e.scores && e.scores.day_temperature != null ? Math.round(e.scores.day_temperature) : '-'}</span></div></td>
    <td>${badge(CROWD_CN[((e.answers||{}).day_crowding||{}).choice] || '-', 'b-gray')}${confChip(((e.answers||{}).day_crowding||{}).confidence)}</td>
    <td class="num" style="color:var(--muted)">${fmtTime(e.computedAt)}</td></tr>`
    + (open ? `<tr class="lg-detail"><td colspan="6">${detailHtml(entry, 'slot')}</td></tr>` : '');
  }
  $('slotTable').innerHTML = `<tr><th>槽位</th><th>框架阶段</th><th>序列</th><th>温度 0-100</th><th>拥挤形态</th><th title="${PCT_TITLE}">分位</th></tr>${rows || '<tr><td colspan="6" class="empty">当日无 ok 槽位文档</td></tr>'}${eodRow}`;
  $('slotHint').textContent = `${STATE.slots.length} 槽 · ${STATE.slots[0]?.slotTime||''} ~ ${STATE.slots.at(-1)?.slotTime||''} · 点击行查看调用日志 · P=模型置信度（红<35 两可勿当结论）`;
}

function renderEod(){
  // EOD 未生成（收盘前）不摆四行「-」了事：同步降级到最新 ok 槽的同题目读数，
  // 表头明示「盘中口径（EOD 待生成）」。day_pattern 无槽级对应题 → 该行留 '-' 并注明。
  // 可用性判定与 renderKpis() 共用 isEodUsable：EOD degraded（answers/scores 全空）时
  // 两处都走盘中降级，不会出现「KPI 有值、EOD 表四行空白」的口径分裂。
  const e = isEodUsable(STATE.eod) ? STATE.eod : null;

// 涨停=触板-炸板（官方简图口径）再剔 ST/北交所；漏标连板判定已按「昨日涨停池」修正
const SCOPE_CN = { zt: '涨停', zhaban: '炸板', excluded: 'ST·北交所', all: '触板全部' };
const SCOPE_PRED = { zt: s => !s.zhaban && !s.excluded, zhaban: s => s.zhaban,
  excluded: s => s.excluded, all: () => true };
function labelBoardOf(s){ return s.boardName || s.board || '未分板块'; }
function labelMatches(s, f, skipHeight){
  if (f.q){ const q = f.q.toLowerCase();
    if (!String(s.code || '').toLowerCase().includes(q) && !String(s.name || '').toLowerCase().includes(q)) return false; }
  if (f.board && labelBoardOf(s) !== f.board) return false;
  if (!skipHeight && f.height){
    // 漏标连板（boardUnmarked，num 空且昨日在「昨日涨停池」）单列：不归首板不猜高度（fail-visible）
    // 首板桶含 boards===1（韭研 one 桶=≤1 板）；2/3 精确匹配；4p=≥4 板
    if (f.height === 'um'){ if (!s.boardUnmarked) return false; }
    else if (f.height === '4p'){ if ((s.boards || 0) < 4) return false; }
    else if (f.height === '1'){ if (s.boardUnmarked || (s.boards && s.boards !== 1)) return false; }
    else if (String(s.boards || 0) !== f.height) return false;
  }
  if (f.driver && (s.label || '') !== f.driver) return false;
  if (f.depth && (s.catalystDepth || '') !== f.depth) return false;
  if (f.fresh && (s.freshness || '') !== f.fresh) return false;
  if (f.buy && (s.buySideLogic || '') !== f.buy) return false;
  return true;
}
function lfSel(label, key, opts){

}
function lfRenderKpi(stocks, f){
  // 触板二分（后端经 THS 炸板池打 zhaban/excluded 标）：涨停家数=官方简图口径（触板-炸板-剔ST/北交所）

  const excluded = stocks.filter(s => s.excluded);
  const zt = stocks.filter(s => !s.zhaban && !s.excluded);
  const canHeight = f.scope === 'zt';

  const b1 = base.filter(s => !s.boardUnmarked && (!s.boards || s.boards === 1)).length;
  const b2 = base.filter(s => s.boards === 2).length;
  const b3 = base.filter(s => s.boards === 3).length;
  const b4p = base.filter(s => (s.boards || 0) >= 4).length;
  const maxBoard = zt.reduce((m, s) => Math.max(m, s.boards || 1), 0);
  const leaders = zt.filter(s => (s.boards || 1) === maxBoard);
  const leaderTxt = maxBoard > 1
    ? esc((leaders[0].name || leaders[0].code || '-')) + (leaders.length > 1 ? ` 等${leaders.length}只` : '')

  const L = STATE.labels || {}, deg = (L.summary || {}).degradedCount || 0;
  const JOIN_CN = {jiuyan_final_missing: '韭研final缺失', prev_pool_missing: '昨日池缺失',

  const card = (k, v, sub) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
  const hCard = (k, v, key) => canHeight

    : `<div class="kpi" title="板数分桶仅涨停范围有意义"><div class="k">${k}</div><div class="v">—</div><div class="s">范围：${SCOPE_CN[f.scope] || f.scope}</div></div>`;
  const zbOpen = zhaban.filter(s => (s.openNum || 0) >= 2).length;
  const zbRate = stocks.length ? Math.round(zhaban.length / stocks.length * 100) : 0;

  const zbCard = `<div class="kpi click${f.scope === 'zhaban' ? ' on' : ''}" title="炸板率=名单内炸板/触板总数；反复开板=THS 开板次数≥2。点击筛选炸板范围" onclick="lfScope('zhaban')"><div class="k">炸板</div><div class="v">${zhaban.length}</div><div class="s">${zbSub}</div></div>`;
  $('labelKpi').innerHTML =
    card('涨停家数', zt.length, `触板 ${stocks.length} · 炸板 ${zhaban.length} · 剔ST/北交所 ${excluded.length}`
      + (bum ? ` · 漏标连板 ${bum}` : '') + joinNote + (deg ? ` · degraded ${deg}` : ''))
    + zbCard

    + card('最高板', maxBoard ? maxBoard + ' 板' : '-', leaderTxt);
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function hi(s, q){
  // 在原始串上定位命中、分段各自 esc：mark 永不切进 HTML 实体中间
  const raw = String(s);
  if (!q) return esc(raw);
  const lr = raw.toLowerCase(), lq = q.toLowerCase();
  let out = '', i = 0;
  for(;;){ const j = lr.indexOf(lq, i);
    if (j < 0){ return out + esc(raw.slice(i)); }

function jtRender(key, val, depth, q){
  const pad = key === null ? '' : `<span class="jt-k">${hi('"'+key+'"', q)}</span>: `;
  if (val !== null && typeof val === 'object'){
    const isArr = Array.isArray(val);
    const entries = isArr ? val.map((v, i) => [String(i), v]) : Object.entries(val);
    if (!entries.length) return `<div class="jt-line">${pad}<span class="jt-br">${isArr ? '[]' : '{}'}</span></div>`;
    const open = q ? true : depth < 2;
    const brace = isArr ? '[' : '{', close = isArr ? ']' : '}';
    return `<div class="jt-node${open ? '' : ' jt-fold'}">`
      + `<div class="jt-line jt-head" onclick="jtFold(this)"><span class="jt-arrow">${open ? '▾' : '▸'}</span>${pad}<span class="jt-br">${brace}</span><span class="jt-count">${entries.length}</span><span class="jt-ellipsis">…${close}</span></div>`
      + `<div class="jt-kids">${entries.map(([k, v]) => jtRender(k, v, depth + 1, q)).join('')}</div>`
      + `<div class="jt-line jt-close"><span class="jt-br">${close}</span></div></div>`;
  }

function jtPrune(val, q){
  const ql = q.toLowerCase();
  function walk(v, k, isItem){
    if (v === null || typeof v !== 'object'){
      const kh = !isItem && k != null && String(k).toLowerCase().includes(ql);
      return (kh || String(v).toLowerCase().includes(ql)) ? { v } : null;
    }
    const isArr = Array.isArray(v), out = isArr ? [] : {};
    let hit = false;
    for (const [kk, vv] of isArr ? v.map((x, i) => [i, x]) : Object.entries(v)){

      if (String(kk).toLowerCase().includes(ql)){ hit = true; out[kk] = vv; continue; }
      const r = walk(vv, kk, false);

  // 单次 /range 双图共享温度轴；seq 守卫防过期响应回写覆盖新图（快速切日期竞态）
  const need = Math.min(60, Math.max(20, pts15.length + ptsR.length + 10));
  fetch('/api/hotlist-jev/range?days=' + need).then(r => r.json()).then(rng => {
    if (seq !== _loadSeq) return;
    const temps = {};
    for (const day of (rng.days || [])) {
      const t = day.eod && day.eod.scores ? day.eod.scores.day_temperature : null;
      if (t != null) temps[day.tradingDate] = t;
    }
    if (pts15.length >= 2) drawChart('relayChart', pts15, temps);
    if (ptsR.length >= 2) drawChart('relayChart2', ptsR, temps);
  }).catch(() => { if (seq === _loadSeq) {
    if (pts15.length >= 2) drawChart('relayChart', pts15, {});
    if (ptsR.length >= 2) drawChart('relayChart2', ptsR, {});
  } });
}

function drawChart(id, pts, temps){
  const W = 1460, H = 220, PL = 46, PR = 16, PT = 14, PB = 26;
  const n = pts.length, minV = 0, maxV = 100;
  const x = i => PL + i * (W - PL - PR) / (n - 1);
  const y = v => PT + (1 - (v - minV) / (maxV - minV)) * (H - PT - PB);
  let grid = '', labels = '', pathR = '', pathT = '', dotsR = '';
  for (let g = 0; g <= 4; g++) {
    const v = g * 25, yy = y(v);
    grid += `<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="#eef2f7"/>`;
    labels += `<text x="${PL-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="#94a3b8">${v}</text>`;
  }
  pts.forEach((r, i) => {
    labels += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#94a3b8">${(r.tradingDate||'').slice(5)}</text>`;
    pathR += `${i ? 'L' : 'M'}${x(i)},${y(r.relayIndex)}`;
    dotsR += `<circle cx="${x(i)}" cy="${y(r.relayIndex)}" r="3.2" fill="#2563eb"><title>${esc(r.tradingDate)} 指数${r.relayIndex} ${esc(PHASE_CN[r.relayPhase]||'')}</title></circle>`;
    const t = temps[r.tradingDate];
    if (t != null) pathT += `${i ? 'L' : 'M'}${x(i)},${y(t)}`;
  });
  $(id).innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${labels}
    ${pathT ? `<path d="${pathT}" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>` : ''}
    <path d="${pathR}" fill="none" stroke="#2563eb" stroke-width="2.4"/>${dotsR}</svg>`;
}

document.querySelectorAll('nav .tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('nav .tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  for (const s of document.querySelectorAll('main section')) s.style.display = 'none';
  $('tab-' + t.dataset.tab).style.display = '';
});
const _d = new Date();
$('date').value = _d.getFullYear() + '-' + String(_d.getMonth() + 1).padStart(2, '0') + '-' + String(_d.getDate()).padStart(2, '0');
// 只监听 change：input 事件会在 fill/清空中间态触发空 date 请求（422 竞态覆盖）
$('date').addEventListener('change', loadAll);
loadAll();
setInterval(loadAll, 60000); // 实时：60s 轮询
</script>
