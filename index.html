<!-- index.html（只改这一部分） -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🐲 龙头看板系统 · 八平台综合</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- 1. 先加载 KPL 题材数据，并桥接到 window -->
    <script type="module">
      import { KPL_THEME_DATA } from '/src/data/kpl_theme_data.js'

      ;(() => {
        // 题材数据
        if (Array.isArray(KPL_THEME_DATA)) {
          window.KPL_THEME_DATA = KPL_THEME_DATA
          console.log('[bridge] ✅ KPL题材数据已挂载, 数量:', KPL_THEME_DATA.length)

          // 触发题材数据就绪事件
          window.dispatchEvent(
            new CustomEvent('kpl-data-ready', {
              detail: { count: KPL_THEME_DATA.length },
            }),
          )
        } else {
          console.warn('[bridge] ⚠️ KPL题材数据未定义')
          // 备用数据...
        }

        // 3. 拼音库加载检查
        const checkPinyin = setInterval(() => {
          if (window.pinyinPro) {
            clearInterval(checkPinyin)
            console.log('[bridge] ✅ 拼音库已加载')
            window.dispatchEvent(new CustomEvent('pinyin-ready'))
          }
        }, 100)
        setTimeout(() => clearInterval(checkPinyin), 5000)
      })()
    </script>

    <!-- 4. 拼音库 -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.0/dist/index.js"></script>

    <!-- 5. 最后加载 Vue 应用 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
