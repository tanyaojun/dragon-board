<!DOCTYPE html>
<html>
<head>
    <title>前端请求调试</title>
</head>
<body>
    <h1>前端请求调试工具</h1>
    
    <div>
        <button onclick="testWithFetch()">使用 Fetch 请求</button>
        <button onclick="testWithAxios()">使用 Axios 请求</button>
        <button onclick="testWithJQuery()">使用 jQuery 请求</button>
    </div>
    
    <div>
        <label>请求头:</label><br>
        <textarea id="headers" rows="5" cols="50">
{
    "Content-Type": "application/json",
    "Authorization": "Bearer test"
}
        </textarea>
    </div>
    
    <div id="result"></div>
    
    <script>
        async function testWithFetch() {
            const headers = JSON.parse(document.getElementById('headers').value);
            
            try {
                const res = await fetch('http://localhost:3000/api/surge-stock/performance', {
                    headers: headers
                });
                
                const data = await res.json();
                document.getElementById('result').innerHTML = `
                    <pre>状态: ${res.status}\n数据: ${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (err) {
                document.getElementById('result').innerHTML = `<pre>错误: ${err}</pre>`;
            }
        }
        
        // 可以添加更多测试函数
    </script>
</body>
</html>
